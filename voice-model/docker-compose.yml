version: "3.9"

services:
  aria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aria-voice-assistant
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env          # copy .env.example → .env and fill in keys
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
    volumes:
      # Hot-reload backend code without rebuilding (dev only)
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
