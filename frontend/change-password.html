<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعيين كلمة المرور | SCM</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="assets/scm-ui.js"></script>
    <style>
        :root { --bg1:#0f2b4d; --bg2:#1e3a8a; --card:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --primary:#1e3a8a; }
        html[data-theme="dark"] { --bg1:#060b16; --bg2:#0f1d38; --card:#131d31; --ink:#e6edf7; --muted:#9fb0c9; --line:#25324a; --primary:#3b82f6; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Tajawal','Segoe UI',sans-serif; background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; padding:1rem; transition:background .3s; }
        .card { background:var(--card); color:var(--ink); border-radius:28px; padding:2.5rem; width:100%; max-width:440px; box-shadow:0 25px 50px rgba(0,0,0,.25); }
        .logo { text-align:center; margin-bottom:1.2rem; }
        .logo span { font-size:2rem; display:inline-flex; align-items:center; justify-content:center; background:var(--primary); width:68px; height:68px; border-radius:20px; color:#fff; }
        h2 { text-align:center; margin-bottom:.4rem; font-weight:800; font-size:1.5rem; }
        .sub { text-align:center; color:var(--muted); margin-bottom:1.8rem; font-size:.88rem; line-height:1.7; }
        label { display:block; margin-bottom:.5rem; font-weight:700; font-size:.85rem; }
        .field { margin-bottom:1.2rem; }
        input { width:100%; padding:13px 16px; border:2px solid var(--line); border-radius:16px; font-size:1rem; font-family:inherit; background:transparent; color:var(--ink); transition:.2s; }
        input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.12); }
        button { width:100%; padding:13px; background:var(--primary); color:#fff; border:none; border-radius:40px; cursor:pointer; font-weight:800; font-size:1rem; font-family:inherit; transition:.2s; }
        button:hover:not(:disabled) { filter:brightness(1.08); transform:translateY(-1px); }
        button:disabled { opacity:.6; cursor:not-allowed; }
        .msg { margin-top:1.1rem; padding:12px; border-radius:14px; display:none; font-size:.85rem; text-align:center; font-weight:600; }
        .msg.err { background:#fee2e2; color:#991b1b; }
        .msg.ok  { background:#dcfce7; color:#166534; }
        .hint { font-size:.72rem; color:var(--muted); margin-top:6px; }
        .strength { height:6px; border-radius:6px; background:var(--line); margin-top:8px; overflow:hidden; }
        .strength i { display:block; height:100%; width:0; transition:width .25s,background .25s; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo"><span>🔒</span></div>
    <h2>تعيين كلمة مرور جديدة</h2>
    <div class="sub">هذه أول مرة تسجّل فيها الدخول. لأمان حسابك، اضبط كلمة مرور جديدة خاصة بك قبل المتابعة.</div>

    <form id="form">
        <div class="field">
            <label>كلمة المرور الجديدة</label>
            <input type="password" id="pass1" placeholder="6 أحرف على الأقل" autocomplete="new-password" required>
            <div class="strength"><i id="strengthBar"></i></div>
            <div class="hint">يُفضّل مزيج من حروف وأرقام ورموز.</div>
        </div>
        <div class="field">
            <label>تأكيد كلمة المرور</label>
            <input type="password" id="pass2" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" required>
        </div>
        <button type="submit" id="btn">حفظ والمتابعة</button>
    </form>
    <div id="msg" class="msg"></div>
</div>

<script>
    const API = 'http://localhost:3000/api/auth/change-password';
    const ROLE_HOME = {
        admin: 'admin-dashboard/admin-dashboard.html',
        manager: 'manager-dashboard/manager-dashboard.html',
        supervisor: 'supervisor-dashboard/supervisor-dashboard.html',
        agent: 'agent-dashboard/agent-dashboard.html',
    };

    function getSession() { try { return JSON.parse(localStorage.getItem('session') || 'null'); } catch (e) { return null; } }
    function getUser() { try { return JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) { return null; } }

    const session = getSession();
    const user = getUser();
    if (!session || !session.access_token || !user) { window.location.replace('login.html'); }

    const $ = (id) => document.getElementById(id);
    const form = $('form'), btn = $('btn'), msg = $('msg');

    function showMsg(t, type) { msg.textContent = t; msg.className = 'msg ' + type; msg.style.display = 'block'; }

    // مؤشّر قوة بسيط
    $('pass1').addEventListener('input', (e) => {
        const v = e.target.value; let s = 0;
        if (v.length >= 6) s++; if (v.length >= 10) s++;
        if (/[0-9]/.test(v)) s++; if (/[^A-Za-z0-9]/.test(v)) s++;
        const bar = $('strengthBar'); const pct = [0, 35, 60, 80, 100][s];
        const col = ['#e2e8f0', '#ef4444', '#f59e0b', '#3b82f6', '#16a34a'][s];
        bar.style.width = pct + '%'; bar.style.background = col;
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = $('pass1').value, p2 = $('pass2').value;
        if (p1.length < 6) { showMsg('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'err'); return; }
        if (p1 !== p2) { showMsg('كلمتا المرور غير متطابقتين', 'err'); return; }

        btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
        try {
            const res = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
                body: JSON.stringify({ new_password: p1 }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) { throw new Error(data.message || 'تعذّر تحديث كلمة المرور'); }

            // امسح علامة التغيير الإجباري محلياً ووجّه للوحة الدور
            user.must_change_password = false;
            localStorage.setItem('user', JSON.stringify(user));
            if (window.SCM) SCM.toast('تم ضبط كلمة المرور بنجاح', 'success');
            showMsg('✓ تم الحفظ — جارٍ التوجيه...', 'ok');
            setTimeout(() => window.location.replace(ROLE_HOME[user.role] || 'login.html'), 700);
        } catch (err) {
            showMsg(err.message, 'err');
            btn.disabled = false; btn.textContent = 'حفظ والمتابعة';
        }
    });
</script>
</body>
</html>
